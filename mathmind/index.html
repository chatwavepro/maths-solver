<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MathMind — a client-side AI chatbot for step-by-step math and logic solving. Bring your own OpenRouter or Gemini API key; everything stays in your browser." />
    <meta name="color-scheme" content="light dark" />
    <title>MathMind — Client-Side AI Math &amp; Logic Solver</title>
    <script>
      // Apply saved theme before first paint to avoid a flash of the wrong mode.
      try {
        var t = localStorage.getItem('mathmind.theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
